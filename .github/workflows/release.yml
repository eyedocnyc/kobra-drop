name: Test and prepare Windows release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test -p kobra-converter --locked
      - run: cargo check -p kobra-drop --locked
      - run: cargo test -p kobra-drop --locked
  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      KOBRA_UPDATE_REPOSITORY: ${{ vars.KOBRA_UPDATE_REPOSITORY }}
      KOBRA_UPDATE_PUBLIC_KEY: ${{ vars.KOBRA_UPDATE_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: New-Item -ItemType Directory -Force .local | Out-Null
      - run: node scripts/configure-release.mjs
      - run: npm run tauri build -- --config .local/release-config.json
      - run: node scripts/manifest.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: kobra-drop-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.sig
            target/release/bundle/nsis/latest.json
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem target/release/bundle/nsis -File | Where-Object { $_.Name -like '*-setup.exe' -or $_.Name -like '*.sig' -or $_.Name -eq 'latest.json' } | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --repo $env:KOBRA_UPDATE_REPOSITORY --draft --verify-tag --generate-notes
