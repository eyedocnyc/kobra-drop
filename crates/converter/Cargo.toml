[package]
name = "kobra-converter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
roxmltree = "0.21"
tempfile = "3"
sha2 = "0.11"

[dev-dependencies]
minisign-verify = "0.3"
base64 = "0.22"

